name: Android

# Builds the release AAB on every push to main (debug-signed if no secrets),
# and uploads to Google Play when a version tag is pushed or on demand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lane:
        description: fastlane lane
        type: choice
        options: [build, beta, release, metadata]
        default: build

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANE: ${{ inputs.lane || (startsWith(github.ref, 'refs/tags/v') && 'beta') || 'build' }}
      # Monotonic version code for CI builds; override with the LUEUR_BUILD_NUMBER variable.
      LUEUR_BUILD_NUMBER: ${{ vars.LUEUR_BUILD_NUMBER || github.run_number }}
      PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
      LUEUR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      LUEUR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      LUEUR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "LUEUR_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key: the AAB will be debug-signed (not accepted by Google Play)."
          fi
      - run: bundle exec fastlane android "$LANE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lueur-android-${{ github.run_number }}
          path: |
            build/android/*.aab
            build/android/*.apk
          if-no-files-found: ignore
