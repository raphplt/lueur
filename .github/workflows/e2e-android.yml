name: E2E Android

# Critical journeys with Maestro on an Android emulator, against a release
# build that includes the demo diary (EXPO_PUBLIC_DEMO=1). Manual or weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Build demo release APK (x86_64)
        run: npm run build:demo:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/flows --format junit --output build/e2e-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            build/e2e-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
