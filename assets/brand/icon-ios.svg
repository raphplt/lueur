    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100" height="100" filter="url(#grain)" opacity="0.08" style="mix-blend-mode:screen"/>
  <defs>
    <radialGradient id="halo" cx="60" cy="51" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8B77A" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#E8B77A" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#E8B77A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(6.0 3.0) scale(0.88)">
    <circle cx="60" cy="51" r="30" fill="url(#halo)"/>
    <line x1="14" y1="62" x2="86" y2="62" stroke="#EFE8DC"
          stroke-opacity="0.9" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="60" cy="51" r="6.5" fill="#E8B77A"/>
  </g>
</svg>
